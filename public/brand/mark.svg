<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Machine Testimony">
  <!-- An opening mark and a closing one, facing each other. Testimony is an
       account, and the record keeps both sides of it: a conflict names at
       least two sides and both are retained. One colour, no frame, legible
       at sixteen pixels. -->
  <g fill="currentColor">
    <rect x="2" y="18" width="20" height="20"/>
    <polygon points="2,38 22,38 2,56"/>
    <rect x="30" y="22" width="20" height="20"/>
    <polygon points="50,22 30,22 50,4"/>
  </g>
</svg>
