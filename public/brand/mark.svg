<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Machine Testimony">
  <!-- Four rules of increasing length: the conformance levels, each one
       containing the ones before it. The frame is open at the top right,
       because a record that cannot be added to is not a record. One colour,
       so it survives a fax, an embossing and a favicon. -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M6 6 H40 M6 6 V58 H58 V24" />
  </g>
  <g fill="currentColor">
    <rect x="16" y="20" width="10" height="3"/>
    <rect x="16" y="29" width="18" height="3"/>
    <rect x="16" y="38" width="26" height="3"/>
    <rect x="16" y="47" width="34" height="3"/>
  </g>
</svg>
