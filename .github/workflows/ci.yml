name: CI

# This repository holds the specification, its reference validator, and the
# adapters that emit records. The product that implements the specification
# lives somewhere else on purpose: a requirement that can only be adopted by
# adopting one vendor's software is a product, not a specification, and
# somebody evaluating the format should not have to visit a vendor's
# repository to read it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: the LangGraph adapter, against a real graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # Without langgraph the suite skips honestly and verifies nothing, which
      # is the failure this job exists to prevent. It runs against a real
      # compiled graph rather than a mock, because the subject is what
      # LangGraph's resume boundary carries and a mock of that boundary would
      # be a mock of the finding.
      - run: pip install langgraph
      - name: The refusals bite
        working-directory: tests
        run: |
          set +e; out=$(python tests_langgraph_testimony.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::adapter suite failed"; exit 1; }
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the adapter suite skipped where langgraph is installed"; exit 1
          fi
      - name: The example reaches TR-4 through the reference validator
        run: |
          python adapters/langgraph/example.py /tmp/record.jsonl
          python spec/testimony_validate.py /tmp/record.jsonl --require TR-4

  crewai-adapter:
    name: the CrewAI adapter, against real CrewAI tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # Real crewai, not a stand-in. The subject is what CrewAI's tool boundary
      # carries and how its pydantic model builds args_schema, and a mock of
      # that boundary would be a mock of the finding. crewai is a heavy install
      # and that is the price of the suite meaning anything.
      - run: pip install crewai
      - name: The gate cannot fail open
        working-directory: tests
        run: |
          set +e; out=$(python tests_crewai_testimony.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::CrewAI adapter suite failed"; exit 1; }
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the CrewAI suite skipped where crewai is installed"; exit 1
          fi

  autogen-adapter:
    name: the AutoGen adapter, against a real workbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install autogen-core
      - name: The gate cannot fail open
        working-directory: tests
        run: |
          set +e; out=$(python tests_autogen_testimony.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::AutoGen adapter suite failed"; exit 1; }
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the AutoGen suite skipped where autogen-core is installed"; exit 1
          fi
  openai-agents-adapter:
    name: the OpenAI Agents adapter, against a real Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # No API key and no network call: only the model is scripted, against the
      # SDK's public Model interface. The Runner, the tool, the interruption
      # and state.approve are the real ones, which is the whole point.
      - run: pip install openai-agents
      - name: An approval that names nobody cannot be written
        working-directory: tests
        run: |
          set +e; out=$(python tests_openai_agents_testimony.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::OpenAI Agents adapter suite failed"; exit 1; }
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the suite skipped where openai-agents is installed"; exit 1
          fi
  package:
    name: pip install, emit, check, with no checkout in sight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install build langgraph
      - run: cd adapters/langgraph && python -m build
      - name: The wheel must carry the validator
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("adapters/langgraph/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for need in ("testimony_langgraph.py", "testimony_validate.py"):
              assert need in names, "%s missing from the wheel: %s" % (need, names)
          print("wheel carries both modules")
          PY
      # The claim on the package page is "pip install, emit, check, no repo".
      # Testing that from the source tree would test the source tree.
      - name: A stranger's graph, against the installed wheel
        run: |
          pip install adapters/langgraph/dist/*.whl
          mkdir -p /tmp/stranger && cd /tmp/stranger
          cat > agent.py <<'PY'
          from langgraph.graph import StateGraph, START, END
          from langgraph.checkpoint.memory import InMemorySaver
          from langgraph.types import interrupt
          from typing_extensions import TypedDict
          from testimony_langgraph import Recorder

          class S(TypedDict, total=False):
              order: str
              ok: bool

          def gate(s):
              return {"ok": bool(interrupt({"action": "cancel_subscription",
                                            "args": {"order": s["order"]}}))}
          g = StateGraph(S); g.add_node("gate", gate)
          g.add_edge(START, "gate"); g.add_edge("gate", END)
          graph = g.compile(checkpointer=InMemorySaver())

          cfg = {"configurable": {"thread_id": "t1"}}
          rec = Recorder(agent={"id": "billing-agent", "kind": "agent"},
                         risk={"cancel_subscription": "high"})
          rec.believe("customer:zed", "requested_cancellation",
                      evidence=[rec.cite("api", "crm://accounts/551")])
          rec.invoke(graph, {"order": "A-551"}, cfg)
          rec.approve(graph, cfg,
                      approver={"id": "sam@example.com", "kind": "human"},
                      identity_source="auth-session")
          rec.write("out.jsonl")
          PY
          python agent.py
          testimony-validate out.jsonl --require TR-4

  drift:
    name: the two copies of the validator are the same file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # There are two copies of the reference validator in the world. This
      # repository publishes it as part of the specification; the OMEM
      # repository vendors it because four of its test suites import it.
      #
      # Two copies is two copies to drift, and a validator that disagrees with
      # itself is worse than no validator: two people would run "the reference
      # validator" on the same record and get different levels. Rather than
      # pretend one repository can own a file in another, this fails loudly the
      # moment they stop being identical.
      #
      # A check that cannot run has verified nothing, so a fetch failure fails
      # the job rather than skipping. Three attempts first, because the network
      # is allowed one bad day.
      - name: Compare against the copy in the OMEM repository
        run: |
          URL=https://raw.githubusercontent.com/troybrandonc-bit/Omem/main/scripts/testimony_validate.py
          for i in 1 2 3; do
            if curl -sfL --max-time 30 "$URL" -o /tmp/theirs.py; then break; fi
            echo "attempt $i could not fetch, retrying"; sleep 5
          done
          if [ ! -s /tmp/theirs.py ]; then
            echo "::error::could not fetch the other copy after three attempts; this check has verified nothing"
            exit 1
          fi
          if ! diff -u /tmp/theirs.py spec/testimony_validate.py > /tmp/d.txt; then
            echo "::error::the two copies of the reference validator have diverged"
            echo "This repository holds the specification, so spec/testimony_validate.py"
            echo "is the canonical one. Update the OMEM copy from it, or bring the"
            echo "change here first if it was made there."
            head -60 /tmp/d.txt
            exit 1
          fi
          echo "identical"

  draft:
    name: the draft renders, and agrees with the validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: gem install kramdown-rfc2629 && pip install xml2rfc
      # There are now two normative statements of this format: the validator,
      # which decides what passes, and the draft, which is what the IETF and
      # anyone implementing from paper will read. A specification that
      # disagrees with its own reference implementation is worse than none,
      # because the disagreement is invisible until somebody has built the
      # wrong thing.
      - name: The draft and the validator agree about every field
        working-directory: tests
        run: python tests_draft_sync.py
      - name: Find the draft source
        run: |
          # Named by pattern, not by version, so bumping -00 to -01 is a rename
          # and not an edit to this file. Exactly one, because two would mean
          # an old revision was left behind and the artifact would be a lottery.
          d=$(ls spec/draft-*-[0-9][0-9].md)
          test "$(echo "$d" | wc -l)" -eq 1 || {
            echo "::error::expected one draft source in spec/, found: $d"; exit 1; }
          echo "DRAFT_MD=$d" >> "$GITHUB_ENV"
          echo "DRAFT_XML=${d%.md}.xml" >> "$GITHUB_ENV"
      - name: Markdown to xml2rfc v3
        run: |
          # Every reference is committed under .refcache, so the usual run needs
          # no network. An earlier version fetched from bib.ietf.org on every
          # commit and failed on a connection reset, which is a job that teaches
          # people to ignore it.
          for i in 1 2 3; do
            kdrfc --v3 --xml "$DRAFT_MD" 2>&1               | tee /tmp/kdrfc.log && break
            echo "attempt $i failed, retrying"; sleep 5
          done
          if grep -qE '^\*\*' /tmp/kdrfc.log; then
            echo "::error::kramdown-rfc warned"; cat /tmp/kdrfc.log; exit 1
          fi
          test -f "$DRAFT_XML" || {
            echo "::error::no XML produced"; exit 1; }
      - name: xml2rfc v3 to text
        run: |
          xml2rfc --text --v3 "$DRAFT_XML"             --out /tmp/draft.txt 2>&1 | tee /tmp/x2r.log
          if grep -qiE "^.*(Error|undefined|unused)" /tmp/x2r.log; then
            echo "::error::xml2rfc reported problems"; cat /tmp/x2r.log; exit 1
          fi
          head -30 /tmp/draft.txt
      - uses: actions/upload-artifact@v4
        with:
          name: internet-draft
          path: |
            ${{ env.DRAFT_XML }}
            /tmp/draft.txt

  browser-validator:
    name: the browser validator agrees with the reference, and is not hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: npm install -g typescript
      # public/check/testimony.js is generated from spec/testimony.ts and served
      # to browsers. A generated file that anyone can hand-edit is a third
      # validator wearing the second one's name, so this regenerates it and
      # fails on any difference. tsc's exit code is ignored on purpose: ambient
      # @types resolution can complain without affecting the emit, and what
      # matters is whether the emitted file matches.
      - name: Regenerating from the TypeScript reproduces the committed file
        run: |
          mkdir -p /tmp/gen
          tsc spec/testimony.ts --target es2020 --module es2020             --removeComments false --outDir /tmp/gen || true
          test -f /tmp/gen/testimony.js || {
            echo "::error::tsc emitted nothing"; exit 1; }
          if ! diff -u /tmp/gen/testimony.js public/check/testimony.js; then
            echo "::error::public/check/testimony.js is not what spec/testimony.ts produces."
            echo "Edit the TypeScript and regenerate; never edit the .js by hand."
            exit 1
          fi
          echo "identical"
      # Two validators that disagree are worse than one, because a conformance
      # claim then depends on which you ran. This runs both over the same
      # records and fails if any verdict differs.
      - name: The TypeScript and the Python agree on every record
        working-directory: tests
        run: |
          set +e; out=$(python tests_testimony_js.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::cross-validator suite failed"; exit 1; }
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the cross-validator suite skipped"; exit 1
          fi

  anchor:
    name: a third party really signs the record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # This suite talks to a real Time Stamp Authority on purpose. The claim
      # under test is that somebody other than us will sign a digest, and a
      # mocked authority would test the mock. It also compares the hand-rolled
      # DER parse against `openssl ts -reply -text`, which the runner has.
      - name: The anchor is held by somebody else
        working-directory: tests
        run: |
          set +e; out=$(python tests_anchor.py 2>&1); rc=$?; set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::error::the anchor suite reported failures"; exit 1
          fi
          if echo "$out" | grep -qiE 'SKIP:|NOT VERIFIED'; then
            echo "::error::the anchor suite degraded to the offline checks; it has not verified that an authority signs anything"
            exit 1
          fi

  pages:
    name: the site's own instructions still work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # /anchor/ prints commands and invites a stranger to run them against
      # files this repository publishes. The suite extracts those commands from
      # the page and runs them, so the page cannot come to describe a
      # verification that no longer happens.
      - name: The page, the record and the token still agree
        working-directory: tests
        run: |
          set +e; out=$(python tests_pages.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::the site suite failed"; exit 1; }
          if echo "$out" | grep -qiE 'NOT VERIFIED'; then
            echo "::error::the page's commands were not actually run"; exit 1
          fi

  implementers:
    name: somebody else can check their own implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # The corpus is what an outsider runs their implementation against, and
      # the emitter is a file they copy. Both are only worth anything if they
      # still agree with the reference, so both are run here rather than
      # trusted because they passed once.
      - name: The corpus still describes the validator, and both pass it
        working-directory: tests
        run: |
          set +e; out=$(python tests_conformance.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::the conformance suite failed"; exit 1; }
          if echo "$out" | grep -qiE 'NOT VERIFIED'; then
            echo "::error::the second implementation was not run through the corpus"
            exit 1
          fi
      - name: The emitter agrees with the reference about every digest
        working-directory: tests
        run: |
          set +e; out=$(python tests_emit.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::the emitter suite failed"; exit 1; }

  census:
    name: the register says what the assessments say
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # The census assesses other people's software, and the register is the
      # surface they would object to. It has to be generated from the subject
      # files rather than written, and the subject files have to keep refusing
      # an assessment nobody else can go and check.
      - name: Every assessment is checkable, and the register renders them
        working-directory: tests
        run: |
          set +e; out=$(python tests_census.py 2>&1); rc=$?; set -e
          echo "$out"
          [ $rc -eq 0 ] || { echo "::error::the census suite failed"; exit 1; }
      - name: The shipped manifest is the manifest of the shipped files
        run: |
          before=$(python -c "import json,io;print(json.load(io.open('census/MANIFEST.json',encoding='utf-8'))['census_digest'])")
          python census/manifest.py >/dev/null
          after=$(python -c "import json,io;print(json.load(io.open('census/MANIFEST.json',encoding='utf-8'))['census_digest'])")
          echo "digest $after"
          if [ "$before" != "$after" ]; then
            echo "::error::MANIFEST.json is stale; run census/manifest.py"; exit 1
          fi
