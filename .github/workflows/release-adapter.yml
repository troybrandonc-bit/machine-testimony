name: Release an adapter

# The adapters are published from this repository rather than from the product
# repository, and that is the whole point of them living here. A user reading
# "Source: github.com/.../Omem" on the package page learns that they are
# installing something from a memory vendor, which discounts exactly the
# neutrality the adapters exist to demonstrate.
#
# Tag format is `testimony-<adapter>-v0.1.0`, e.g. testimony-crewai-v0.1.0.
# Everything else follows from the tag: the adapter directory, the module, the
# suite and the framework to install. A sixth adapter needs a tag and a pending
# publisher rather than a sixth copy of this file.
#
# Auth is PyPI trusted publishing (OIDC), not a token, so there is no
# long-lived credential here that could overwrite a package people install.
# Configure a pending publisher once per project at
# https://pypi.org/manage/account/publishing/ before its first tag:
#   PyPI project name: testimony-<adapter>
#   owner: troybrandonc-bit          repo: machine-testimony
#   workflow: release-adapter.yml    environment: pypi-testimony-<adapter>
#
# Configured: testimony-langgraph.
# STILL TO CONFIGURE before their first tag: testimony-crewai,
# testimony-autogen, testimony-openai-agents, testimony-pydantic-ai.

on:
  push:
    tags: ["testimony-*-v*"]
  workflow_dispatch:
    inputs:
      adapter:
        description: "Adapter directory, e.g. crewai"
        required: true
      dry_run:
        description: "Build and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  identify:
    name: work out what is being released
    runs-on: ubuntu-latest
    outputs:
      adapter: ${{ steps.d.outputs.adapter }}
      version: ${{ steps.d.outputs.version }}
      module: ${{ steps.d.outputs.module }}
      suite: ${{ steps.d.outputs.suite }}
      dep: ${{ steps.d.outputs.dep }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # Derived from the tag being built rather than passed between jobs by
      # hand. release.yml learned that the hard way: a partial re-run does not
      # re-execute the job that produced the output, and the empty string that
      # arrived downstream tagged the repository `v`.
      - id: d
        env:
          REF: ${{ github.ref_name }}
          INPUT: ${{ inputs.adapter }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys, tomllib
          ref, given = os.environ.get("REF", ""), os.environ.get("INPUT", "")
          m = re.fullmatch(r"testimony-(.+)-v(.+)", ref)
          if m:
              adapter, version = m.group(1), m.group(2)
          elif given:
              adapter, version = given, ""
          else:
              sys.exit("::error::cannot tell which adapter: ref %r" % ref)
          d = os.path.join("adapters", adapter)
          if not os.path.isdir(d):
              sys.exit("::error::no such adapter directory: %s" % d)
          proj = tomllib.load(open(os.path.join(d, "pyproject.toml"), "rb"))
          declared = proj["project"]["version"]
          if version and version != declared:
              sys.exit("::error::tag says %s, pyproject says %s"
                       % (version, declared))
          name = proj["project"]["name"]
          if name != "testimony-" + adapter:
              sys.exit("::error::directory %s holds package %s" % (adapter, name))
          under = adapter.replace("-", "_")
          print("adapter=" + adapter)
          print("version=" + declared)
          print("module=testimony_%s" % under)
          print("suite=tests_%s_testimony.py" % under)
          # The framework to install for the suite is the package's own single
          # dependency, so it cannot drift from what the wheel declares.
          print("dep=" + proj["project"]["dependencies"][0])
          PY
      - name: the package must not already exist at this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          A=${{ steps.d.outputs.adapter }}; V=${{ steps.d.outputs.version }}
          if curl -sf "https://pypi.org/pypi/testimony-$A/$V/json" >/dev/null; then
            echo "::error::testimony-$A $V is already on PyPI. Bump the version."
            exit 1
          fi

  test:
    name: the adapter suite on the tagged commit
    runs-on: ubuntu-latest
    needs: identify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "${{ needs.identify.outputs.dep }}"
      # The refusals are the substance of these packages, so a release that has
      # not run them has verified nothing worth verifying.
      - name: The refusals still bite
        working-directory: tests
        run: |
          out=$(python "${{ needs.identify.outputs.suite }}")
          echo "$out"
          if echo "$out" | grep -qE '^[[:space:]]*SKIP:'; then
            echo "::error::the adapter suite skipped on a release commit"; exit 1
          fi

  build:
    name: build and prove a stranger can use it
    runs-on: ubuntu-latest
    needs: [identify, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install build
      - run: python -m build adapters/${{ needs.identify.outputs.adapter }}
      - name: The wheel must carry what the adapter imports
        env:
          ADAPTER: ${{ needs.identify.outputs.adapter }}
          MODULE: ${{ needs.identify.outputs.module }}
        run: |
          python - <<'PY'
          import glob, io, os, zipfile
          a, mod = os.environ["ADAPTER"], os.environ["MODULE"] + ".py"
          whl = sorted(glob.glob("adapters/%s/dist/*.whl" % a))[-1]
          names = zipfile.ZipFile(whl).namelist()
          need = [mod, "testimony_validate.py"]
          src = io.open(os.path.join("adapters", a, mod), encoding="utf-8").read()
          if "import testimony_emit" in src:
              need.append("testimony_emit.py")
          missing = [n for n in need if n not in names]
          if missing:
              raise SystemExit("::error::%s missing from %s" % (missing, whl))
          print("wheel carries", need)
          PY
      # Installed, in a directory with no checkout in it, exactly as the package
      # page promises. Testing from the source tree would test the source tree.
      - name: pip install, emit, check, with no checkout in sight
        env:
          MODULE: ${{ needs.identify.outputs.module }}
        run: |
          pip install adapters/${{ needs.identify.outputs.adapter }}/dist/*.whl
          mkdir -p /tmp/stranger && cd /tmp/stranger
          python - <<'PY'
          import importlib, os, sys
          assert not any("machine-testimony" in p for p in sys.path), sys.path
          importlib.import_module(os.environ["MODULE"])
          import testimony_emit as em, testimony_validate as tv
          r = em.Record(); r.scope(acts=True)
          d = r.decision(action_type="issue_refund", risk_class="high",
                         risk_source="registry",
                         proposed_by={"id": "agent", "kind": "agent"},
                         verdict="permitted", executed=True)
          r.approval(decision=d, approver={"id": "s@e.com", "kind": "human"},
                     identity_source="auth-session")
          r.seal()
          open("out.jsonl", "w", newline="\n").write(r.jsonl())
          rep = tv.validate(open("out.jsonl", encoding="utf-8").read())
          assert rep.level == "TR-4", rep.level
          print("emitted and validated from the wheel alone:", rep.level)
          PY
          testimony-validate out.jsonl --require TR-4
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-dist
          path: adapters/${{ needs.identify.outputs.adapter }}/dist/

  publish:
    name: publish to PyPI
    needs: [identify, build]
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi-testimony-${{ needs.identify.outputs.adapter }}
      url: https://pypi.org/p/testimony-${{ needs.identify.outputs.adapter }}
    permissions:
      id-token: write        # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with: { name: adapter-dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` on purpose. Trusted publishing uses the OIDC token, so
        # there is no long-lived credential in this repository that could
        # overwrite a package people pip-install.
